<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="100%" role="img" aria-label="시나리오별 지식 노동 고용 변화와 실업률">
  <defs>
    <style>
      @font-face{font-family:"Wanted Sans";src:url("../fonts/WantedSansVariable.woff2") format("woff2-variations");font-weight:400 1000;font-display:swap}
      text{font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    </style>
  </defs>
  <rect width="760" height="336" fill="#ffffff"/>

  <text x="30" y="40" font-size="17" font-weight="700" fill="#1c1917">지식 노동에 무슨 일이 일어나나 (2030년)</text>
  <text x="30" y="63" font-size="12.5" fill="#57534e">AI가 지식 노동의 일자리를 줄이고 실업을 늘린다. 변화가 클수록 격차가 급격히 벌어진다</text>

  <!-- ===== 왼쪽: 고용 변화 ===== -->
  <text x="44" y="102" font-size="13.5" font-weight="700" fill="#3730a3">① 지식 노동 고용 변화</text>
  <text x="44" y="120" font-size="11" fill="#78716c">2026년 중반 대비</text>

  <line x1="44" y1="196" x2="352" y2="196" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="352" y="212" font-size="10.5" fill="#a8a29e" text-anchor="end">0%</text>

  <rect x="64" y="196" width="62" height="2" rx="1" fill="#a5b4fc"/>
  <rect x="164" y="196" width="62" height="12" rx="3" fill="#fbbf24"/>
  <rect x="264" y="196" width="62" height="65" rx="4" fill="#f87171"/>

  <text x="95" y="216" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">−0.5%</text>
  <text x="195" y="226" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">−3.9%</text>
  <text x="295" y="279" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">−21.5%</text>

  <!-- ===== 오른쪽: 실업률 ===== -->
  <text x="418" y="102" font-size="13.5" font-weight="700" fill="#3730a3">② 지식 노동 실업률</text>
  <text x="418" y="120" font-size="11" fill="#78716c">점선 = AI가 없을 때(2.9%)</text>

  <line x1="418" y1="196" x2="726" y2="196" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="726" y="212" font-size="10.5" fill="#a8a29e" text-anchor="end">0%</text>
  <!-- 정상 수준 기준선 -->
  <line x1="418" y1="187.3" x2="726" y2="187.3" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="438" y="187.3" width="62" height="8.7" rx="2" fill="#a5b4fc"/>
  <rect x="538" y="182.5" width="62" height="13.5" rx="3" fill="#fbbf24"/>
  <rect x="638" y="142.3" width="62" height="53.7" rx="4" fill="#f87171"/>

  <text x="469" y="178" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">2.9%</text>
  <text x="569" y="173" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">4.5%</text>
  <text x="669" y="133" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">17.9%</text>

  <!-- 시나리오 이름 -->
  <text x="95" y="306" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">점진적</text>
  <text x="195" y="306" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">상당한 변화</text>
  <text x="295" y="306" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">극단적</text>
  <text x="469" y="306" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">점진적</text>
  <text x="569" y="306" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">상당한 변화</text>
  <text x="669" y="306" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">극단적</text>

  <text x="30" y="328" font-size="11" fill="#a8a29e">* 극단적 시나리오의 17.9%는 지식 노동자 약 5명 중 1명이 실업이라는 뜻. 전체 실업률도 11.9%까지 오른다.</text>
</svg>
