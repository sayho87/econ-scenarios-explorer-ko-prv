<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" width="100%" role="img" aria-label="2030년 지식 노동자의 이동 비율">
  <defs>
    <style>
      @font-face{font-family:"Wanted Sans";src:url("../fonts/WantedSansVariable.woff2") format("woff2-variations");font-weight:400 1000;font-display:swap}
      text{font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    </style>
  </defs>
  <rect width="760" height="274" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1c1917">지식 노동자는 2030년 어디에 있을까 (상당한 변화 시나리오)</text>
  <text x="24" y="58" font-size="12.5" fill="#57534e">전체 지식 노동자 중 비율. 변화가 클수록 '직업을 바꾸는 사람'이 늘고, 실직도 늘어난다</text>

  <g>
    <!-- 막대 -->
    <rect x="60" y="100" width="394" height="60" rx="8" fill="#4f46e5"/>
    <rect x="454" y="100" width="249" height="60" fill="#fbbf24"/>
    <rect x="703" y="100" width="17" height="60" rx="4" fill="#dc2626"/>

    <!-- 막대 안 비율 -->
    <text x="257" y="136" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">59.7%</text>
    <text x="578" y="136" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">37.8%</text>

    <!-- 2.5% : 좁은 구간이라 위쪽에 표시 -->
    <text x="711" y="88" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">2.5%</text>
    <line x1="711" y1="92" x2="711" y2="98" stroke="#dc2626" stroke-width="1.2"/>

    <!-- 각 구간 → 라벨 연결선 -->
    <line x1="60" y1="160" x2="60" y2="172" stroke="#4f46e5" stroke-width="1.5"/>
    <line x1="454" y1="160" x2="454" y2="172" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="711" y1="160" x2="711" y2="172" stroke="#dc2626" stroke-width="1.5"/>

    <!-- 라벨 : 색 구간 시작점에 정렬 -->
    <text x="60" y="190" font-size="12.5" fill="#3730a3" font-weight="700">■ 같은 직업에 남음 59.7%</text>
    <text x="454" y="190" font-size="12.5" fill="#b45309" font-weight="700">■ 다른 직업으로 이동 37.8%</text>
    <text x="735" y="190" font-size="12.5" fill="#b91c1c" font-weight="700" text-anchor="end">■ 실직 상태 2.5%</text>

    <text x="60" y="224" font-size="12" fill="#57534e">예를 들어 코더·콜센터 상담원이 전기공·간호사처럼 AI 영향을 덜 받는 직업으로 옮겨 가야 할 수 있다.</text>
    <text x="60" y="246" font-size="11" fill="#a8a29e">* 극단적 시나리오에서는 이동·실직 비율이 더 커지고, 실업이 오래 갈 수 있다.</text>
  </g>
</svg>
