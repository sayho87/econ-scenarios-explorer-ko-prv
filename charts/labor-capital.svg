<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="100%" role="img" aria-label="시나리오별 노동과 자본의 몫">
  <defs>
    <style>
      @font-face{font-family:"Wanted Sans";src:url("../fonts/WantedSansVariable.woff2") format("woff2-variations");font-weight:400 1000;font-display:swap}
      text{font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    </style>
  </defs>
<rect width="760" height="312" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1c1917" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">만들어진 돈 1달러, 누가 가져가나</text>
  <text x="24" y="58" font-size="12.5" fill="#57534e" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">노동(일한 사람)과 자본(돈·기계를 가진 쪽)의 몫. 변화가 클수록 자본 쪽으로 쏠린다</text>

  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
    <text x="24" y="106" font-size="13" font-weight="700" fill="#1c1917">점진적</text>
    <rect x="140" y="88" width="333" height="34" rx="6" fill="#4f46e5"/>
    <rect x="473" y="88" width="227" height="34" rx="6" fill="#c7d2fe"/>
    <text x="150" y="110" font-size="12.5" fill="#ffffff" font-weight="700">노동 59.4%</text>
    <text x="483" y="110" font-size="12.5" fill="#3730a3" font-weight="700">자본 40.6%</text>

    <text x="24" y="176" font-size="13" font-weight="700" fill="#1c1917">상당한 변화</text>
    <rect x="140" y="158" width="314" height="34" rx="6" fill="#4f46e5"/>
    <rect x="454" y="158" width="246" height="34" rx="6" fill="#c7d2fe"/>
    <text x="150" y="180" font-size="12.5" fill="#ffffff" font-weight="700">노동 56.1%</text>
    <text x="464" y="180" font-size="12.5" fill="#3730a3" font-weight="700">자본 43.9%</text>

    <text x="24" y="246" font-size="13" font-weight="700" fill="#1c1917">극단적</text>
    <rect x="140" y="228" width="253" height="34" rx="6" fill="#4f46e5"/>
    <rect x="393" y="228" width="307" height="34" rx="6" fill="#c7d2fe"/>
    <text x="150" y="250" font-size="12.5" fill="#ffffff" font-weight="700">노동 45.2%</text>
    <text x="403" y="250" font-size="12.5" fill="#3730a3" font-weight="700">자본 54.8%</text>

    <text x="24" y="286" font-size="11.5" fill="#57534e">극단적 시나리오에서는 자본 몫이 처음으로 노동 몫을 넘어선다 (오늘은 노동 약 60% · 자본 약 40%).</text>
  </g>
</svg>
