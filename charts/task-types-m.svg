<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="100%" role="img" aria-label="간호사의 과업이 오늘에서 2030년으로 어떻게 바뀌는지 보여 주는 도표">
  <defs>
    <style>
      @font-face{font-family:"Wanted Sans";src:url("../fonts/WantedSansVariable.woff2") format("woff2-variations");font-weight:400 1000;font-display:swap}
      text{font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    </style>
  </defs>
  <rect width="360" height="800" fill="#ffffff"/>

  <text x="16" y="28" font-size="15" font-weight="700" fill="#1c1917">간호사의 하루는 이렇게 바뀐다</text>
  <text x="16" y="48" font-size="10" fill="#57534e">직업이 통째로 사라지는 게 아니라, 과업 하나하나가 바뀐다</text>

  <text x="16" y="78" font-size="12" font-weight="700" fill="#78716c">지금 (AS-IS) · 전부 사람이 직접 하는 일</text>

  <rect x="16" y="90" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="28" y="106" font-size="10.5" fill="#44403c">환자 목욕시키기</text>
  <rect x="16" y="120" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="28" y="136" font-size="10.5" fill="#44403c">환자와 대화하기</text>
  <rect x="16" y="150" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="28" y="166" font-size="10.5" fill="#44403c">활력 징후 손으로 기록</text>
  <rect x="16" y="180" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="28" y="196" font-size="10.5" fill="#44403c">물품 주문 전화하기</text>
  <rect x="16" y="210" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="28" y="226" font-size="10.5" fill="#44403c">퇴원 안내문 직접 작성</text>
  <rect x="16" y="240" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="28" y="256" font-size="10.5" fill="#44403c">근무표 짜기</text>

  <polygon points="174,274 186,274 180,284" fill="#d6d3d1"/>

  <text x="16" y="306" font-size="12" font-weight="700" fill="#57534e">이렇게 바뀐다</text>

  <rect x="16" y="316" width="328" height="40" rx="8" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.3"/>
  <text x="28" y="334" font-size="11" font-weight="700" fill="#57534e">① 변화 없음</text>
  <text x="28" y="349" font-size="9.5" fill="#78716c">사람만 할 수 있는 일은 그대로</text>

  <rect x="16" y="362" width="328" height="40" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.3"/>
  <text x="28" y="380" font-size="11" font-weight="700" fill="#047857">② 보조 · 증강</text>
  <text x="28" y="395" font-size="9.5" fill="#059669">AI가 도와서 더 빠르고 정확하게</text>

  <rect x="16" y="408" width="328" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="28" y="426" font-size="11" font-weight="700" fill="#1d4ed8">③ 자동화</text>
  <text x="28" y="441" font-size="9.5" fill="#2563eb">AI가 혼자 처리, 사람은 안 해도 됨</text>

  <rect x="16" y="454" width="328" height="40" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.3"/>
  <text x="28" y="472" font-size="11" font-weight="700" fill="#6d28d9">④ 새로 생긴 과업</text>
  <text x="28" y="487" font-size="9.5" fill="#7c3aed">AI가 한 일을 점검하는 새 일</text>

  <polygon points="174,504 186,504 180,514" fill="#c7d2fe"/>

  <text x="16" y="536" font-size="12" font-weight="700" fill="#4338ca">2030년 (TO-BE) · 나머지 일을 더 많이</text>

  <rect x="16" y="548" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="28" y="564" font-size="10.5" fill="#57534e">환자 목욕시키기</text>
  <rect x="16" y="578" width="328" height="24" rx="6" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="28" y="594" font-size="10.5" fill="#57534e">환자와 훨씬 더 많이 대화</text>
  <rect x="16" y="608" width="328" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="28" y="624" font-size="10.5" fill="#1d4ed8">AI가 활력 징후 자동 기록</text>
  <rect x="16" y="638" width="328" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="28" y="654" font-size="10.5" fill="#1d4ed8">AI가 물품 자동 주문</text>
  <rect x="16" y="668" width="328" height="24" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="28" y="684" font-size="10.5" fill="#047857">AI 원격 모니터링</text>
  <rect x="16" y="698" width="328" height="24" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="28" y="714" font-size="10.5" fill="#6d28d9">AI 분류 결과 확인</text>

  <text x="16" y="748" font-size="10" fill="#57534e">→ 손으로 기록하고 전화하던 일은 AI가 맡고,</text>
  <text x="16" y="766" font-size="10" fill="#57534e">   사람은 환자와의 시간과 AI가 한 일 점검으로 옮겨 간다.</text>
  <text x="16" y="790" font-size="9.5" fill="#a8a29e">과업 목록 출처: 미국 노동부 O*NET 분류</text>
</svg>
