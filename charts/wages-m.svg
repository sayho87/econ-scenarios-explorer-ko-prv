<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" width="100%" role="img" aria-label="시나리오별 지식 노동자와 그 외 노동자의 임금 변화">
  <defs>
    <style>
      @font-face{font-family:"Wanted Sans";src:url("../fonts/WantedSansVariable.woff2") format("woff2-variations");font-weight:400 1000;font-display:swap}
      text{font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    </style>
  </defs>
  <rect width="360" height="372" fill="#ffffff"/>

  <text x="16" y="28" font-size="15" font-weight="700" fill="#1c1917">임금은 어디가 오르고 어디가 멈추나</text>
  <text x="16" y="48" font-size="10.5" fill="#57534e">AI가 없을 때와 비교한 2030년 임금 차이(%)</text>

  <rect x="16" y="60" width="10" height="10" rx="2" fill="#6366f1"/>
  <text x="31" y="69" font-size="10" font-weight="700" fill="#4338ca">지식 노동자</text>
  <rect x="150" y="60" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="165" y="69" font-size="10" font-weight="700" fill="#047857">그 외 노동자</text>

  <line x1="180" y1="86" x2="180" y2="330" stroke="#d6d3d1" stroke-width="1.2"/>

  <text x="16" y="106" font-size="11.5" font-weight="700" fill="#1c1917">점진적 변화(lv1)</text>
  <rect x="180" y="114" width="3" height="18" rx="1.5" fill="#6366f1"/>
  <text x="189" y="128" font-size="10.5" font-weight="700" fill="#4338ca">+0.4%</text>
  <rect x="180" y="140" width="5" height="18" rx="1.5" fill="#10b981"/>
  <text x="191" y="154" font-size="10.5" font-weight="700" fill="#047857">+1.1%</text>

  <text x="16" y="182" font-size="11.5" font-weight="700" fill="#1c1917">상당한 변화(lv2)</text>
  <rect x="177" y="190" width="3" height="18" rx="1.5" fill="#6366f1"/>
  <text x="171" y="204" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="end">−0.3%</text>
  <rect x="180" y="216" width="29" height="18" rx="3" fill="#10b981"/>
  <text x="215" y="230" font-size="10.5" font-weight="700" fill="#047857">+5.9%</text>

  <text x="16" y="258" font-size="11.5" font-weight="700" fill="#1c1917">극단적 변화(lv3)</text>
  <rect x="124" y="266" width="56" height="18" rx="3" fill="#6366f1"/>
  <text x="174" y="280" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="end">−11.5%</text>
  <rect x="180" y="292" width="165" height="18" rx="3" fill="#10b981"/>
  <text x="339" y="306" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="end">+33.6%</text>

  <text x="180" y="344" font-size="9.5" fill="#a8a29e" text-anchor="middle">0%</text>
  <text x="16" y="362" font-size="9.5" fill="#a8a29e">* 극단적 변화(lv3)에서 지식 노동 임금만 마이너스</text>
</svg>
