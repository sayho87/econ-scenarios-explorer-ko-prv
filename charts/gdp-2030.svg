<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="시나리오별 2030년 미국 GDP 막대 그래프">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1c1917" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">2030년 미국 GDP — 시나리오별</text>
  <text x="24" y="58" font-size="12.5" fill="#57534e" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">막대 높이 = 그해 미국이 만드는 돈의 총합(국내총생산). AI가 없을 때보다 얼마나 늘어나는지 함께 표시</text>

  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
    <line x1="60" y1="278" x2="735" y2="278" stroke="#d6d3d1" stroke-width="1.5"/>

    <rect x="100" y="124" width="110" height="154" rx="8" fill="#a5b4fc"/>
    <text x="155" y="112" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle">$34.1T</text>
    <text x="155" y="300" font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">점진적 (Modest)</text>
    <text x="155" y="320" font-size="12" fill="#57534e" text-anchor="middle">+1.6% · 약 45,900조 원</text>

    <rect x="315" y="115" width="110" height="163" rx="8" fill="#fbbf24"/>
    <text x="370" y="103" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">$36.3T</text>
    <text x="370" y="300" font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">상당한 변화 (Substantial)</text>
    <text x="370" y="320" font-size="12" fill="#57534e" text-anchor="middle">+8.3% · 약 48,800조 원</text>

    <rect x="530" y="78" width="110" height="200" rx="8" fill="#f87171"/>
    <text x="585" y="66" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">$44.4T</text>
    <text x="585" y="300" font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">극단적 (Extreme)</text>
    <text x="585" y="320" font-size="12" fill="#57534e" text-anchor="middle">+32.4% · 약 59,700조 원</text>

    <text x="24" y="330" font-size="11" fill="#a8a29e">* 2025년 가격 기준. 한화는 1달러 ≈ 1,345원으로 단순 환산한 근사값(환율에 따라 달라짐).</text>
  </g>
</svg>
