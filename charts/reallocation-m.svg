<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="100%" role="img" aria-label="시나리오별 지식 노동 고용 변화와 실업률">
  <defs>
    <style>
      @font-face{font-family:"Wanted Sans";src:url("../fonts/WantedSansVariable.woff2") format("woff2-variations");font-weight:400 1000;font-display:swap}
      text{font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    </style>
  </defs>
  <rect width="360" height="520" fill="#ffffff"/>

  <text x="16" y="28" font-size="15" font-weight="700" fill="#1c1917">지식 노동에 무슨 일이 일어나나</text>
  <text x="16" y="47" font-size="10.5" fill="#57534e">2030년 기준. 변화가 클수록 격차가 급격히 벌어진다</text>

  <text x="16" y="80" font-size="12.5" font-weight="700" fill="#3730a3">① 지식 노동 고용 변화</text>
  <text x="16" y="96" font-size="9.5" fill="#78716c">2026년 중반 대비</text>

  <text x="16" y="124" font-size="11" font-weight="700" fill="#1c1917">점진적 변화(lv1)</text>
  <text x="344" y="124" font-size="13" font-weight="700" fill="#4338ca" text-anchor="end">−0.5%</text>
  <rect x="16" y="132" width="6" height="16" rx="3" fill="#a5b4fc"/>

  <text x="16" y="176" font-size="11" font-weight="700" fill="#1c1917">상당한 변화(lv2)</text>
  <text x="344" y="176" font-size="13" font-weight="700" fill="#b45309" text-anchor="end">−3.9%</text>
  <rect x="16" y="184" width="45" height="16" rx="4" fill="#fbbf24"/>

  <text x="16" y="228" font-size="11" font-weight="700" fill="#1c1917">극단적 변화(lv3)</text>
  <text x="344" y="228" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="end">−21.5%</text>
  <rect x="16" y="236" width="250" height="16" rx="4" fill="#f87171"/>

  <text x="16" y="292" font-size="12.5" font-weight="700" fill="#3730a3">② 지식 노동 실업률</text>
  <text x="16" y="308" font-size="9.5" fill="#78716c">점선 = AI가 없을 때(2.9%)</text>

  <line x1="56" y1="320" x2="56" y2="474" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="16" y="336" font-size="11" font-weight="700" fill="#1c1917">점진적 변화(lv1)</text>
  <text x="344" y="336" font-size="13" font-weight="700" fill="#4338ca" text-anchor="end">2.9%</text>
  <rect x="16" y="344" width="40" height="16" rx="3" fill="#a5b4fc"/>

  <text x="16" y="388" font-size="11" font-weight="700" fill="#1c1917">상당한 변화(lv2)</text>
  <text x="344" y="388" font-size="13" font-weight="700" fill="#b45309" text-anchor="end">4.5%</text>
  <rect x="16" y="396" width="63" height="16" rx="3" fill="#fbbf24"/>

  <text x="16" y="440" font-size="11" font-weight="700" fill="#1c1917">극단적 변화(lv3)</text>
  <text x="344" y="440" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="end">17.9%</text>
  <rect x="16" y="448" width="250" height="16" rx="4" fill="#f87171"/>

  <text x="16" y="492" font-size="9.5" fill="#a8a29e">* 17.9% = 지식 노동자 약 5명 중 1명이 실업.</text>
  <text x="16" y="508" font-size="9.5" fill="#a8a29e">  전체 실업률도 11.9%까지 오른다.</text>
</svg>
