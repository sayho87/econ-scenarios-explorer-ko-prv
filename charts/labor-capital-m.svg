<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="100%" role="img" aria-label="시나리오별 노동과 자본의 몫">
  <defs>
    <style>
      @font-face{font-family:"Wanted Sans";src:url("../fonts/WantedSansVariable.woff2") format("woff2-variations");font-weight:400 1000;font-display:swap}
      text{font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    </style>
  </defs>
  <rect width="360" height="290" fill="#ffffff"/>

  <text x="16" y="28" font-size="15" font-weight="700" fill="#1c1917">만들어진 돈 1달러, 누가 가져가나</text>
  <text x="16" y="48" font-size="10" fill="#57534e">노동 = 임금 · 자본 = 설비를 가진 쪽이 받는 몫(이익·배당·이자)</text>

  <text x="16" y="80" font-size="11.5" font-weight="700" fill="#1c1917">점진적 변화(lv1)</text>
  <rect x="16" y="88" width="194" height="30" rx="6" fill="#4f46e5"/>
  <rect x="210" y="88" width="134" height="30" rx="6" fill="#c7d2fe"/>
  <text x="28" y="108" font-size="11" font-weight="700" fill="#ffffff">노동 59.4%</text>
  <text x="220" y="108" font-size="11" font-weight="700" fill="#3730a3">자본 40.6%</text>

  <text x="16" y="146" font-size="11.5" font-weight="700" fill="#1c1917">상당한 변화(lv2)</text>
  <rect x="16" y="154" width="184" height="30" rx="6" fill="#4f46e5"/>
  <rect x="200" y="154" width="144" height="30" rx="6" fill="#c7d2fe"/>
  <text x="28" y="174" font-size="11" font-weight="700" fill="#ffffff">노동 56.1%</text>
  <text x="210" y="174" font-size="11" font-weight="700" fill="#3730a3">자본 43.9%</text>

  <text x="16" y="212" font-size="11.5" font-weight="700" fill="#1c1917">극단적 변화(lv3)</text>
  <rect x="16" y="220" width="148" height="30" rx="6" fill="#4f46e5"/>
  <rect x="164" y="220" width="180" height="30" rx="6" fill="#c7d2fe"/>
  <text x="28" y="240" font-size="11" font-weight="700" fill="#ffffff">노동 45.2%</text>
  <text x="174" y="240" font-size="11" font-weight="700" fill="#3730a3">자본 54.8%</text>

  <text x="16" y="274" font-size="9.5" fill="#a8a29e">* 극단적 변화(lv3)에서 자본 몫이 처음으로 노동 몫을 넘어선다</text>
</svg>
