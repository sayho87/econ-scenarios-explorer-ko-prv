<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="어떤 과업이 AI로 어떻게 바뀌는지 보여 주는 도표">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1c1917" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">간호사의 하루로 보는 '과업'의 운명</text>
  <text x="24" y="58" font-size="12.5" fill="#57534e" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">AI는 직업을 통째로 없애기보다, 과업 하나하나를 서로 다르게 바꾼다</text>

  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
    <rect x="20" y="82" width="170" height="170" rx="14" fill="#f5f5f4" stroke="#e7e5e4"/>
    <text x="38" y="112" font-size="13.5" font-weight="700" fill="#57534e">① 변화 없음</text>
    <text x="38" y="140" font-size="12" fill="#78716c">사람만 할 수 있는 일</text>
    <text x="38" y="168" font-size="12" fill="#1c1917">환자 목욕시키기</text>
    <text x="38" y="190" font-size="12" fill="#1c1917">환자와 대화하기</text>

    <rect x="205" y="82" width="170" height="170" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="223" y="112" font-size="13.5" font-weight="700" fill="#047857">② 보조 (증강)</text>
    <text x="223" y="140" font-size="12" fill="#059669">AI가 도와 더 빠르게</text>
    <text x="223" y="168" font-size="12" fill="#1c1917">퇴원 안내문 초안</text>
    <text x="223" y="190" font-size="12" fill="#1c1917">원격 모니터링</text>
    <text x="223" y="212" font-size="12" fill="#1c1917">근무표 짜기</text>

    <rect x="390" y="82" width="170" height="170" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="408" y="112" font-size="13.5" font-weight="700" fill="#1d4ed8">③ 자동화</text>
    <text x="408" y="140" font-size="12" fill="#2563eb">AI가 혼자 처리</text>
    <text x="408" y="168" font-size="12" fill="#1c1917">활력 징후 기록</text>
    <text x="408" y="190" font-size="12" fill="#1c1917">병동 물품 주문</text>

    <rect x="575" y="82" width="170" height="170" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="593" y="112" font-size="13.5" font-weight="700" fill="#6d28d9">④ 새로 생긴 일</text>
    <text x="593" y="140" font-size="12" fill="#7c3aed">AI 때문에 새로 생김</text>
    <text x="593" y="168" font-size="12" fill="#1c1917">AI 분류 결과 확인</text>
    <text x="593" y="190" font-size="12" fill="#1c1917">AI 치료계획 검토</text>

    <text x="24" y="286" font-size="12" fill="#57534e">→ 이렇게 과업이 바뀌면 '간호사'라는 직업의 내용도 조금씩 달라진다. 나머지 일을 더 많이 맡게 되고, 생산성은 올라간다.</text>
    <text x="24" y="308" font-size="11" fill="#a8a29e">과업 목록 출처: 미국 노동부 O*NET 분류</text>
  </g>
</svg>
